<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>大家一起溜大象</title>

<style>
body{
    font-family:"Microsoft JhengHei",sans-serif;
    text-align:center;
    background:linear-gradient(#cfefff,#ffffff);
    padding:30px;
}

.card{
    max-width:500px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:25px;
    box-shadow:0 5px 15px rgba(0,0,0,0.15);
}

.elephant{
    font-size:100px;
}

button{
    padding:15px 25px;
    border:none;
    border-radius:15px;
    background:#6ea8d9;
    color:white;
    font-size:20px;
    cursor:pointer;
}

button:hover{
    background:#4e90cc;
}

.counter{
    font-size:24px;
    margin:15px;
}
</style>
</head>

<body>

<div class="card">

<h1>🐘 大家一起溜大象 🐘</h1>

<div id="elephant" class="elephant">🐘</div>

<div class="counter">
🌍 總共溜了：
<span id="totalWalks">0</span> 次
</div>

<div class="counter">
👤 你溜了：
<span id="myWalks">0</span> 次
</div>

<button onclick="walkElephant()">
🚶 溜大象
</button>

<p id="message">
大象正在等你帶牠散步！
</p>

</div>

<script>
let totalWalks =
Number(localStorage.getItem("totalWalks")) || 0;

let myWalks =
Number(localStorage.getItem("myWalks")) || 0;

updateDisplay();

function walkElephant(){

    totalWalks++;
    myWalks++;

    localStorage.setItem("totalWalks", totalWalks);
    localStorage.setItem("myWalks", myWalks);

    updateDisplay();

    const elephant = document.getElementById("elephant");

    if(totalWalks >= 100){
        elephant.innerText = "👑🐘";
    }
    else if(totalWalks >= 50){
        elephant.innerText = "🥳🐘";
    }
    else if(totalWalks >= 20){
        elephant.innerText = "😆🐘";
    }
    else{
        elephant.innerText = "🐘";
    }
}

function updateDisplay(){
    document.getElementById("totalWalks").innerText = totalWalks;
    document.getElementById("myWalks").innerText = myWalks;

    document.getElementById("message").innerText =
        `🐘 今天已經散步 ${totalWalks} 次啦！`;
}
</script>

</body>
</html>
