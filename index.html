<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧪 元素之域：2000+化學式魔王卡池 v6.0</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --panel-bg: #161b22;
            --text-color: #c9d1d9;
            --ssr-color: #ff4500;
            --ssr-glow: #ff7b00;
            --sr-color: #a371f7;
            --r-color: #58a6ff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #ffffff;
            margin-bottom: 5px;
            font-weight: 400;
            letter-spacing: 2px;
        }

        .subtitle {
            color: #8b949e;
            margin-bottom: 30px;
            font-size: 0.9rem;
        }

        .stats-panel {
            background-color: var(--panel-bg);
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 12px 25px;
            display: flex;
            gap: 25px;
            margin-bottom: 10px;
            font-size: 0.95rem;
        }

        .stat-item span { font-weight: bold; }
        .stat-ssr { color: var(--ssr-color); }
        .stat-sr { color: var(--sr-color); }
        .stat-r { color: var(--r-color); }

        .energy-container {
            width: 320px;
            background-color: #21262d;
            border: 1px solid #30363d;
            border-radius: 10px;
            height: 12px;
            margin-bottom: 8px;
            overflow: hidden;
            position: relative;
        }
        .energy-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #58a6ff, #a371f7);
            transition: width 0.3s ease;
        }

        .lock-hint {
            color: #f0883e;
            font-size: 0.85rem;
            margin-bottom: 25px;
            font-weight: bold;
            height: 18px;
        }
        .lock-hint.unlocked { color: #56d364; }

        .btn-container {
            display: flex;
            gap: 15px;
            margin-bottom: 35px;
        }

        button {
            background-color: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
            padding: 12px 24px;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button:hover:not(:disabled) {
            background-color: #30363d;
            border-color: #8b949e;
        }

        button.primary {
            background-color: #238636;
            color: #ffffff;
            border-color: #2ea44f;
        }
        button.primary:hover:not(:disabled) { background-color: #2ea44f; }

        button:disabled {
            background-color: #161b22;
            color: #484f58;
            border-color: #21262d;
            cursor: not-allowed;
            opacity: 0.4;
        }

        button.cooldown {
            background-color: #21262d !important;
            color: #f0883e !important;
            border-color: #f0883e !important;
        }

        .result-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            max-width: 1000px;
            width: 100%;
            margin-bottom: 50px;
            min-height: 240px;
        }

        .card {
            background-color: var(--panel-bg);
            border: 2px solid #30363d;
            border-radius: 8px;
            width: 160px;
            height: 240px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px 15px;
            box-sizing: border-box;
            animation: fadeIn 0.4s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card .rarity { font-size: 1.2rem; font-weight: 900; letter-spacing: 1px; }
        .card .formula { font-size: 1.05rem; font-weight: bold; color: #ffffff; text-align: center; word-break: break-all; margin: auto 0; line-height: 1.2; }
        .card .name { font-size: 0.75rem; color: #8b949e; text-align: center; height: 35px; display: flex; align-items: center; justify-content: center; }

        .card.R { border-color: var(--r-color); } .card.R .rarity { color: var(--r-color); }
        .card.SR { border-color: var(--sr-color); box-shadow: 0 0 10px rgba(163, 113, 247, 0.2); } .card.SR .rarity { color: var(--sr-color); }
        .card.SSR { 
            border-color: var(--ssr-color); 
            box-shadow: 0 0 20px var(--ssr-glow);
            animation: sscrGlow 2s infinite alternate;
        }
        .card.SSR .rarity { color: var(--ssr-color); text-shadow: 0 0 5px var(--ssr-glow); }

        @keyframes sscrGlow { from { box-shadow: 0 0 10px rgba(255, 69, 0, 0.5); } to { box-shadow: 0 0 25px rgba(255, 123, 0, 0.8); } }

        .inventory-section {
            width: 100%;
            max-width: 900px;
            background-color: var(--panel-bg);
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 25px;
            box-sizing: border-box;
            margin-top: 20px;
        }

        .inventory-title {
            font-size: 1.2rem;
            color: #ffffff;
            margin-bottom: 20px;
            border-bottom: 1px solid #30363d;
            padding-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
        }

        .inv-item {
            background-color: #21262d;
            border-left: 4px solid #30363d;
            padding: 10px 15px;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
        }

        .inv-item.R { border-left-color: var(--r-color); }
        .inv-item.SR { border-left-color: var(--sr-color); }
        .inv-item.SSR { border-left-color: var(--ssr-color); }
        
        .inv-count {
            background-color: #30363d;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.8rem;
            color: #ffffff;
        }

        sub { font-size: 0.6em; bottom: -0.1em; }
    </style>
</head>
<body>

    <h1>ULTIMATE CHEMICAL GACHA</h1>
    <div class="subtitle">🧪 元素之域 · 2000+ 種無窮衍生卡池 v6.0</div>

    <div class="stats-panel">
        <div class="total-draws">總抽數：<span id="total-draws">0</span></div>
        <div class="stat-item">卡池總數：<span id="pool-size" style="color:#56d364;">0</span> 種</div>
    </div>
    
    <div class="stats-panel" style="margin-top:-5px; padding: 6px 20px; font-size:0.85rem; border-color:#21262d;">
        <div class="stat-item stat-ssr">SSR：<span id="count-ssr">0</span></div>
        <div class="stat-item stat-sr">SR：<span id="count-sr">0</span></div>
        <div class="stat-item stat-r">R：<span id="count-r">0</span></div>
    </div>

    <div style="font-size:0.85rem; margin-bottom:5px; color:#8b949e;">十連抽量子充能進度：</div>
    <div class="energy-container">
        <div class="energy-bar" id="energy-bar"></div>
    </div>
    <div class="lock-hint" id="lock-message">🔋 還需要進行 10 次單抽以充能十連抽。</div>

    <div class="btn-container">
        <button id="btn-single-draw" onclick="gachaAction(1)">單抽能量 (+1充能)</button>
        <button class="primary" id="btn-ten-draw" onclick="gachaAction(10)" disabled>釋放量子十連抽 (消耗能量)</button>
        <button id="btn-reset" onclick="resetStats()">重置數據</button>
    </div>

    <div class="result-container" id="result-display"></div>

    <div class="inventory-section">
        <div class="inventory-title">
            <span>🎒 我的化學元素背包 (已收集 <span id="unique-count" style="color:#58a6ff;">0</span> 種)</span>
        </div>
        <div class="inventory-grid" id="inventory-display"></div>
    </div>

    <script>
        // 1. 基礎無機物卡池
        const BASE_POOL = {
            SSR: [
                { formula: "KMnO<sub>4</sub>", name: "高錳酸鉀" }, { formula: "KCN", name: "氰化鉀 (劇毒)" },
                { formula: "C<sub>12</sub>H<sub>22</sub>O<sub>11</sub>", name: "蔗糖" }, { formula: "HNO<sub>3</sub>", name: "濃硝酸" },
                { formula: "C<sub>20</sub>H<sub>14</sub>O<sub>4</sub>", name: "酚酞指示劑" }, { formula: "H<sub>2</sub>PtCl<sub>6</sub>", name: "氯鉑酸" },
                { formula: "Ag(NH<sub>3</sub>)<sub>2</sub>OH", name: "多倫試劑" }, { formula: "C<sub>2</sub>O<sub>4</sub><sup>2-</sup>", name: "草酸根離子" }
            ],
            SR: [
                { formula: "H<sub>2</sub>SO<sub>4</sub>", name: "硫酸" }, { formula: "HCl", name: "鹽酸" },
                { formula: "NaOH", name: "氫氧化鈉" }, { formula: "CaCO<sub>3</sub>", name: "碳酸鈣" },
                { formula: "H<sub>2</sub>O<sub>2</sub>", name: "過氧化氫" }, { formula: "NaHCO<sub>3</sub>", name: "碳酸氫鈉" },
                { formula: "CuSO<sub>4</sub>", name: "硫酸銅" }, { formula: "NH<sub>4</sub>NO<sub>3</sub>", name: "硝酸銨" },
                { formula: "H<sub>3</sub>PO<sub>4</sub>", name: "磷酸" }, { formula: "Al<sub>2</sub>(SO<sub>4</sub>)<sub>3</sub>", name: "硫酸鋁" }
            ],
            R: [
                { formula: "H<sub>2</sub>O", name: "水" }, { formula: "NaCl", name: "氯化鈉" },
                { formula: "CO<sub>2</sub>", name: "二氧化碳" }, { formula: "O<sub>2</sub>", name: "氧氣" },
                { formula: "CO", name: "一氧化碳" }, { formula: "NH<sub>3</sub>", name: "氨氣" }
            ]
        };

        // 完整元素週期表常規元素
        const ELEMENTS = [
            {f:"H", n:"氫"}, {f:"He", n:"氦"}, {f:"Li", n:"鋰"}, {f:"Be", n:"鈹"}, {f:"B", n:"硼"},
            {f:"C", n:"碳"}, {f:"N", n:"氮"}, {f:"O", n:"氧"}, {f:"F", n:"氟"}, {f:"Ne", n:"氖"},
            {f:"Na", n:"鈉"}, {f:"Mg", n:"鎂"}, {f:"Al", n:"鋁"}, {f:"Si", n:"矽"}, {f:"P", n:"磷"},
            {f:"S", n:"硫"}, {f:"Cl", n:"氯"}, {f:"Ar", n:"氬"}, {f:"K", n:"鉀"}, {f:"Ca", n:"鈣"},
            {f:"Sc", n:"鈧"}, {f:"Ti", n:"鈦"}, {f:"V", n:"釩"}, {f:"Cr", n:"鉻"}, {f:"Mn", n:"錳"},
            {f:"Fe", n:"鐵"}, {f:"Co", n:"鈷"}, {f:"Ni", n:"鎳"}, {f:"Cu", n:"銅"}, {f:"Zn", n:"鋅"},
            {f:"Ga", n:"鎵"}, {f:"Ge", n:"鍺"}, {f:"As", n:"砷"}, {f:"Se", n:"硒"}, {f:"Br", n:"溴"},
            {f:"Kr", n:"氪"}, {f:"Rb", n:"銣"}, {f:"Sr", n:"鍶"}, {f:"Y", n:"釔"}, {f:"Zr", n:"鋯"},
            {f:"Ag", n:"銀"}, {f:"Cd", n:"鎘"}, {f:"Sn", n:"錫"}, {f:"I", n:"碘"}, {f:"Xe", n:"氙"},
            {f:"Pt", n:"鉑"}, {f:"Au", n:"金"}, {f:"Hg", n:"汞"}, {f:"Pb", n:"鉛"}, {f:"U", n:"鈾"}
        ];

        // 天干與中文數字前綴（一路開到二十）
        const PREFIXES = ["甲", "乙", "丙", "丁", "戊", "己", "庚", "辛", "壬", "癸", "十一", "十二", "十三", "十四", "十五", "十六", "十七", "十八", "十九", "二十"];
        let FINAL_POOL = { SSR: [], SR: [], R: [] };
        
        function initGachaPool() {
            FINAL_POOL.SSR = [...BASE_POOL.SSR]; FINAL_POOL.SR = [...BASE_POOL.SR]; FINAL_POOL.R = [...BASE_POOL.R];
            ELEMENTS.forEach(el => FINAL_POOL.R.push({ formula: el.f, name: el.n }));

            // 20層深度循環生成器
            PREFIXES.forEach((pref, index) => {
                let c = index + 1;
                
                // 1. 烷類 (C_n H_2n+2)
                let h_alkane = c * 2 + 2;
                if(c <= 4) FINAL_POOL.R.push({ formula: `C<sub>${c}</sub>H<sub>${h_alkane}</sub>`, name: `${pref}烷` });
                else FINAL_POOL.SR.push({ formula: `C<sub>${c}</sub>H<sub>${h_alkane}</sub>`, name: `${pref}烷` });
                
                // 2. 烯類 (C_n H_2n) 與 炔類 (C_n H_2n-2)
                if (c >= 2) {
                    FINAL_POOL.SR.push({ formula: `C<sub>${c}</sub>H<sub>${c*2}</sub>`, name: `${pref}烯` });
                    FINAL_POOL.SR.push({ formula: `C<sub>${c}</sub>H<sub>${c*2-2}</sub>`, name: `${pref}炔` });
                }
                
                // 3. 醇類 (C_n H_2n+1 OH)
                if(c <= 4) FINAL_POOL.SR.push({ formula: `C<sub>${c}</sub>H<sub>${c*2+1}</sub>OH`, name: `${pref}醇` });
                else FINAL_POOL.SSR.push({ formula: `C<sub>${c}</sub>H<sub>${c*2+1}</sub>OH`, name: `${pref}醇` });

                // 4. 羧酸類 (C_n-1 H_2n-1 COOH)
                let c_acid = c - 1;
                let h_acid = c_acid * 2 + 1;
                let acidForm = c_acid === 0 ? "HCOOH" : `C<sub>${c_acid}</sub>H<sub>${h_acid}</sub>COOH`;
                if(c <= 4) FINAL_POOL.SR.push({ formula: acidForm, name: `${pref}酸` });
                else FINAL_POOL.SSR.push({ formula: acidForm, name: `${pref}酸` });

                // 5. 酯類暴力全展開 (20 * 20 = 400種交叉組合) -> 塞爆 SSR 宇宙
                PREFIXES.forEach((pref2, index2) => {
                    let c2 = index2 + 1;
                    FINAL_POOL.SSR.push({
                        formula: `C<sub>${c}</sub>H<sub>${c*2+1}</sub>COOC<sub>${c2}</sub>H<sub>${c2*2+1}</sub>`,
                        name: `${pref}酸${pref2}酯`
                    });
                });
            });

            // 統計總數
            let totalSize = FINAL_POOL.SSR.length + FINAL_POOL.SR.length + FINAL_POOL.R.length;
            document.getElementById("pool-size").innerText = totalSize;
        }
        initGachaPool();

        // 2. 狀態與邏輯控制
        let stats = { total: 0, SSR: 0, SR: 0, R: 0 };
        let energyCharge = 0;
        let myInventory = {};
        let isThrottled = false; 

        function drawSingleCard(forceSRorAbove = false) {
            let roll = Math.random();
            const CHANCE_SSR = 0.03; const CHANCE_SR = 0.12;

            if (forceSRorAbove) {
                const srChanceInGuarantee = CHANCE_SR / (CHANCE_SSR + CHANCE_SR);
                return roll > srChanceInGuarantee ? { rarity: "SSR", data: getRandomItem(FINAL_POOL.SSR) } : { rarity: "SR", data: getRandomItem(FINAL_POOL.SR) };
            }
            if (roll < CHANCE_SSR) return { rarity: "SSR", data: getRandomItem(FINAL_POOL.SSR) };
            if (roll < CHANCE_SSR + CHANCE_SR) return { rarity: "SR", data: getRandomItem(FINAL_POOL.SR) };
            return { rarity: "R", data: getRandomItem(FINAL_POOL.R) };
        }

        function getRandomItem(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

        function gachaAction(times) {
            if (isThrottled) return; 
            executeGacha(times);
            const cooldownTime = times === 1 ? 1500 : 3000; 
            startCooldown(times, cooldownTime);
        }

        function startCooldown(type, duration) {
            isThrottled = true;
            const singleBtn = document.getElementById("btn-single-draw");
            const tenBtn = document.getElementById("btn-ten-draw");
            const resetBtn = document.getElementById("btn-reset");

            singleBtn.disabled = true;
            tenBtn.disabled = true;
            resetBtn.disabled = true;

            const activeBtn = (type === 1) ? singleBtn : tenBtn;
            activeBtn.className += " cooldown";

            let timeLeft = duration / 1000;
            activeBtn.innerText = `冷卻中... ${timeLeft.toFixed(1)}s`;

            const interval = setInterval(() => {
                timeLeft -= 0.1;
                if (timeLeft <= 0) {
                    clearInterval(interval);
                    isThrottled = false;
                    singleBtn.className = "";
                    tenBtn.className = "primary";
                    
                    singleBtn.disabled = false;
                    resetBtn.disabled = false;
                    
                    singleBtn.innerText = "單抽能量 (+1充能)";
                    tenBtn.innerText = "釋放量子十連抽 (消耗能量)";
                    
                    updateStatsUI();
                } else {
                    activeBtn.innerText = `冷卻中... ${timeLeft.toFixed(1)}s`;
                }
            }, 100);
        }

        function executeGacha(times) {
            const display = document.getElementById("result-display");
            display.innerHTML = "";

            let currentResults = [];
            let hasSRorAbove = false;

            if (times === 1) {
                if (energyCharge < 10) energyCharge++;
            } else if (times === 10) {
                energyCharge = 0; 
            }

            for (let i = 0; i < times; i++) {
                let forceGuarantee = (times === 10 && i === 9 && !hasSRorAbove);
                let card = drawSingleCard(forceGuarantee);
                
                if (card.rarity === "SSR" || card.rarity === "SR") hasSRorAbove = true;
                
                currentResults.push(card);
                stats.total++;
                stats[card.rarity]++;
                addToInventory(card);
            }

            currentResults.forEach((card, index) => {
                setTimeout(() => {
                    const cardElement = document.createElement("div");
                    cardElement.className = `card ${card.rarity}`;
                    cardElement.innerHTML = `
                        <div class="rarity">${card.rarity}</div>
                        <div class="formula">${card.data.formula}</div>
                        <div class="name">${card.data.name}</div>
                    `;
                    display.appendChild(cardElement);
                }, index * 60);
            });

            updateStatsUI();
            updateInventoryUI();
        }

        function addToInventory(card) {
            const key = card.data.formula;
            if (myInventory[key]) {
                myInventory[key].count++;
            } else {
                myInventory[key] = { name: card.data.name, rarity: card.rarity, count: 1 };
            }
        }

        function updateStatsUI() {
            document.getElementById("total-draws").innerText = stats.total;
            document.getElementById("count-ssr").innerText = stats.SSR;
            document.getElementById("count-sr").innerText = stats.SR;
            document.getElementById("count-r").innerText = stats.R;
            
            const percentage = (energyCharge / 10) * 100;
            document.getElementById("energy-bar").style.width = `${percentage}%`;

            const tenDrawBtn = document.getElementById("btn-ten-draw");
            const lockMsg = document.getElementById("lock-message");

            if (!isThrottled) {
                if (energyCharge >= 10) {
                    tenDrawBtn.disabled = false;
                    lockMsg.innerText = "🔋 能量完全充滿！量子十連抽已就緒！";
                    lockMsg.className = "lock-hint unlocked";
                } else {
                    tenDrawBtn.disabled = true;
                    lockMsg.innerText = `🔋 十連抽充能中... （目前進度：${energyCharge}/10 單抽）`;
                    lockMsg.className = "lock-hint";
                }
            }
        }

        function updateInventoryUI() {
            const invDisplay = document.getElementById("inventory-display");
            invDisplay.innerHTML = "";

            const sortedItems = Object.keys(myInventory).map(key => {
                return { formula: key, ...myInventory[key] };
            }).sort((a, b) => {
                const order = { "SSR": 1, "SR": 2, "R": 3 };
                return order[a.rarity] - order[b.rarity];
            });

            document.getElementById("unique-count").innerText = sortedItems.length;

            if (sortedItems.length === 0) {
                invDisplay.innerHTML = `<div style="color: #8b949e; grid-column: 1/-1; text-align: center; padding: 20px;">目前背包空空如也，快去進行單抽收集吧！</div>`;
                return;
            }

            sortedItems.forEach(item => {
                const itemDiv = document.createElement("div");
                itemDiv.className = `inv-item ${item.rarity}`;
                itemDiv.innerHTML = `
                    <div>
                        <strong style="color: #ffffff;">${item.formula}</strong> 
                        <br><span style="font-size:0.7rem; color:#8b949e;">${item.name} [${item.rarity}]</span>
                    </div>
                    <div class="inv-count">×${item.count}</div>
                `;
                invDisplay.appendChild(itemDiv);
            });
        }

        function resetStats() {
            if (isThrottled) return;
            stats = { total: 0, SSR: 0, SR: 0, R: 0 };
            energyCharge = 0;
            myInventory = {};
            document.getElementById("result-display").innerHTML = "";
            updateStatsUI();
            updateInventoryUI();
        }

        updateStatsUI();
        updateInventoryUI();
    </script>
</body>
</html>
