<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧪 元素之域：千種化學式時間凍結版 v5.0</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --panel-bg: #161b22;
            --text-color: #c9d1d9;
            --ssr-color: #ff4500;
            --ssr-glow: #ff7b00;
            --sr-color: #a371f7;
            --r-color: #58a6ff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #ffffff;
            margin-bottom: 5px;
            font-weight: 400;
            letter-spacing: 2px;
        }

        .subtitle {
            color: #8b949e;
            margin-bottom: 30px;
            font-size: 0.9rem;
        }

        .stats-panel {
            background-color: var(--panel-bg);
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 12px 25px;
            display: flex;
            gap: 25px;
            margin-bottom: 10px;
            font-size: 0.95rem;
        }

        .stat-item span { font-weight: bold; }
        .stat-ssr { color: var(--ssr-color); }
        .stat-sr { color: var(--sr-color); }
        .stat-r { color: var(--r-color); }

        .energy-container {
            width: 320px;
            background-color: #21262d;
            border: 1px solid #30363d;
            border-radius: 10px;
            height: 12px;
            margin-bottom: 8px;
            overflow: hidden;
            position: relative;
        }
        .energy-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #58a6ff, #a371f7);
            transition: width 0.3s ease;
        }

        .lock-hint {
            color: #f0883e;
            font-size: 0.85rem;
            margin-bottom: 25px;
            font-weight: bold;
            height: 18px;
        }
        .lock-hint.unlocked { color: #56d364; }

        .btn-container {
            display: flex;
            gap: 15px;
            margin-bottom: 35px;
        }

        button {
            background-color: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
            padding: 12px 24px;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button:hover:not(:disabled) {
            background-color: #30363d;
            border-color: #8b949e;
        }

        button.primary {
            background-color: #238636;
            color: #ffffff;
            border-color: #2ea44f;
        }
        button.primary:hover:not(:disabled) { background-color: #2ea44f; }

        button:disabled {
            background-color: #161b22;
            color: #484f58;
            border-color: #21262d;
            cursor: not-allowed;
            opacity: 0.4;
        }

        /* 凍結倒數中的特別按鈕樣式 */
        button.cooldown {
            background-color: #21262d !important;
            color: #f0883e !important;
            border-color: #f0883e !important;
        }

        .result-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            max-width: 1000px;
            width: 100%;
            margin-bottom: 50px;
            min-height: 240px;
        }

        .card {
            background-color: var(--panel-bg);
            border: 2px solid #30363d;
            border-radius: 8px;
            width: 160px;
            height: 240px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px 15px;
            box-sizing: border-box;
            animation: fadeIn 0.4s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card .rarity { font-size: 1.2rem; font-weight: 900; letter-spacing: 1px; }
        .card .formula { font-size: 1.15rem; font-weight: bold; color: #ffffff; text-align: center; word-break: break-all; margin: auto 0; line-height: 1.2; }
        .card .name { font-size: 0.8rem; color: #8b949e; text-align: center; height: 35px; display: flex; align-items: center; justify-content: center; }

        .card.R { border-color: var(--r-color); } .card.R .rarity { color: var(--r-color); }
        .card.SR { border-color: var(--sr-color); box-shadow: 0 0 10px rgba(163, 113, 247, 0.2); } .card.SR .rarity { color: var(--sr-color); }
        .card.SSR { 
            border-color: var(--ssr-color); 
            box-shadow: 0 0 20px var(--ssr-glow);
            animation: sscrGlow 2s infinite alternate;
        }
        .card.SSR .rarity { color: var(--ssr-color); text-shadow: 0 0 5px var(--ssr-glow); }

        @keyframes sscrGlow { from { box-shadow: 0 0 10px rgba(255, 69, 0, 0.5); } to { box-shadow: 0 0 25px rgba(255, 123, 0, 0.8); } }

        .inventory-section {
            width: 100%;
            max-width: 900px;
            background-color: var(--panel-bg);
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 25px;
            box-sizing: border-box;
            margin-top: 20px;
        }

        .inventory-title {
            font-size: 1.2rem;
            color: #ffffff;
            margin-bottom: 20px;
            border-bottom: 1px solid #30363d;
            padding-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
        }

        .inv-item {
            background-color: #21262d;
            border-left: 4px solid #30363d;
            padding: 10px 15px;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
        }

        .inv-item.R { border-left-color: var(--r-color); }
        .inv-item.SR { border-left-color: var(--sr-color); }
        .inv-item.SSR { border-left-color: var(--ssr-color); }
        
        .inv-count {
            background-color: #30363d;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.8rem;
            color: #ffffff;
        }

        sub { font-size: 0.6em; bottom: -0.1em; }
    </style>
</head>
<body>

    <h1>QUANTUM CHEMICAL GACHA</h1>
    <div class="subtitle">🧪 元素之域 · 防速點時間凍結充能版 v5.0</div>

    <div class="stats-panel">
        <div class="total-draws">總抽數：<span id="total-draws">0</span></div>
        <div class="stat-item">卡池總數：<span id="pool-size" style="color:#56d364;">0</span> 種</div>
    </div>
    
    <div class="stats-panel" style="margin-top:-5px; padding: 6px 20px; font-size:0.85rem; border-color:#21262d;">
        <div class="stat-item stat-ssr">SSR：<span id="count-ssr">0</span></div>
        <div class="stat-item stat-sr">SR：<span id="count-sr">0</span></div>
        <div class="stat-item stat-r">R：<span id="count-r">0</span></div>
    </div>

    <div style="font-size:0.85rem; margin-bottom:5px; color:#8b949e;">十連抽量子充能進度：</div>
    <div class="energy-container">
        <div class="energy-bar" id="energy-bar"></div>
    </div>
    <div class="lock-hint" id="lock-message">🔋 還需要進行 10 次單抽以充能十連抽。</div>

    <div class="btn-container">
        <button id="btn-single-draw" onclick="gachaAction(1)">單抽能量 (+1充能)</button>
        <button class="primary" id="btn-ten-draw" onclick="gachaAction(10)" disabled>釋放量子十連抽 (消耗能量)</button>
        <button id="btn-reset" onclick="resetStats()">重置數據</button>
    </div>

    <div class="result-container" id="result-display"></div>

    <div class="inventory-section">
        <div class="inventory-title">
            <span>🎒 我的化學元素背包 (已收集 <span id="unique-count" style="color:#58a6ff;">0</span> 種)</span>
        </div>
        <div class="inventory-grid" id="inventory-display"></div>
    </div>
