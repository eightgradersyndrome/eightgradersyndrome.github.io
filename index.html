<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的大象</title>

<style>
body{
    font-family:"Microsoft JhengHei",sans-serif;
    text-align:center;
    background:linear-gradient(#cfefff,#ffffff);
    padding:30px;
}

.card{
    max-width:500px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:25px;
    box-shadow:0 5px 15px rgba(0,0,0,0.15);
}

.elephant{
    font-size:100px;
}

button{
    padding:10px 20px;
    margin:5px;
    border:none;
    border-radius:15px;
    cursor:pointer;
    background:#6ea8d9;
    color:white;
    font-size:16px;
}

button:hover{
    background:#4e90cc;
}

.status{
    font-size:20px;
    margin:10px;
}

#message{
    font-weight:bold;
    color:#ff6b81;
}
</style>
</head>

<body>

<div class="card">

<h1>🐘 我的大象 🐘</h1>

<div class="elephant">🐘</div>

<h2 id="name">小花</h2>

<div class="status">❤️ 心情：<span id="mood">100</span></div>
<div class="status">🍌 飽食度：<span id="hunger">100</span></div>
<div class="status">😴 精力：<span id="energy">100</span></div>

<p id="message">大象今天很開心！</p>

<button onclick="feed()">🍌 餵香蕉</button>
<button onclick="play()">🎾 玩球</button>
<button onclick="sleepPet()">😴 睡覺</button>

</div>

<script>
let mood = 100;
let hunger = 100;
let energy = 100;

function updateStatus(){
    document.getElementById("mood").innerText = mood;
    document.getElementById("hunger").innerText = hunger;
    document.getElementById("energy").innerText = energy;

    let msg = "大象今天很開心！";

    if(hunger < 30) msg = "🐘 大象肚子餓了...";
    if(energy < 30) msg = "🐘 大象好想睡覺...";
    if(mood < 30) msg = "🐘 大象有點難過...";

    document.getElementById("message").innerText = msg;
}

function feed(){
    hunger = Math.min(hunger + 20,100);
    mood = Math.min(mood + 5,100);
    updateStatus();
}

function play(){
    mood = Math.min(mood + 15,100);
    hunger = Math.max(hunger - 10,0);
    energy = Math.max(energy - 15,0);
    updateStatus();
}

function sleepPet(){
    energy = Math.min(energy + 25,100);
    mood = Math.min(mood + 5,100);
    updateStatus();
}

setInterval(() => {
    hunger = Math.max(hunger - 1,0);
    energy = Math.max(energy - 1,0);

    if(hunger < 20 || energy < 20){
        mood = Math.max(mood - 1,0);
    }

    updateStatus();
},3000);

updateStatus();
</script>

</body>
</html>
